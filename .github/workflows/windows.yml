name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }

      - name: Read application version
        id: version
        run: |
          $version = python -c "from french_notes import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Could not read the application version." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Test, build EXE, verify packaged EXE and build installer
        run: |
          ./packaging/build_windows.ps1 -Python python -SkipDependencyInstall -BuildInstaller -InstallInnoSetup

      - name: Verify installation, shortcuts and preservation of local data
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # This runner is disposable. Do not run this installation probe on a user's PC.
          $setup = Join-Path $env:GITHUB_WORKSPACE "dist/FrenchNotes-Setup-$env:APP_VERSION.exe"
          $installPath = Join-Path $env:RUNNER_TEMP "FrenchNotes installed app"
          $dataPath = Join-Path $env:LOCALAPPDATA "FrenchNotes"
          New-Item -ItemType Directory -Path $dataPath -Force | Out-Null
          $probePath = Join-Path $dataPath "ci-preservation-probe.txt"
          "preserve local notes" | Set-Content -LiteralPath $probePath -Encoding utf8
          $install = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-",
            ('/DIR="{0}"' -f $installPath), "/TASKS=desktopicon"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)." }
          $installedExe = Join-Path $installPath "FrenchNotes.exe"
          $startMenuLink = Join-Path ([Environment]::GetFolderPath("Programs")) "FrenchNotes/FrenchNotes.lnk"
          $desktopLink = Join-Path ([Environment]::GetFolderPath("DesktopDirectory")) "FrenchNotes.lnk"
          foreach ($expectedFile in @($installedExe, $startMenuLink, $desktopLink)) {
            if (-not (Test-Path -LiteralPath $expectedFile -PathType Leaf)) {
              throw "Installer did not create $expectedFile."
            }
          }
          $installedSmokePath = Join-Path $env:RUNNER_TEMP ("FrenchNotes-installed-self-test-" + [guid]::NewGuid().ToString("N"))
          $installedSmoke = Start-Process -FilePath $installedExe -ArgumentList @(
            "--self-test", ('"{0}"' -f $installedSmokePath)
          ) -Wait -PassThru
          if ($installedSmoke.ExitCode -ne 0) { throw "Installed EXE self-test failed." }
          $report = Get-Content -LiteralPath (Join-Path $installedSmokePath "self-test-result.json") -Raw -Encoding UTF8 | ConvertFrom-Json
          if (($report.success -isnot [bool]) -or (-not $report.success)) { throw "Installed EXE report does not confirm success." }
          $uninstaller = Join-Path $installPath "unins000.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed." }
          if (Test-Path -LiteralPath $installedExe) { throw "Uninstaller did not remove the program." }
          if (-not (Test-Path -LiteralPath $probePath)) { throw "Uninstaller removed local user data." }

      - name: Preserve self-test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FrenchNotes-Windows-self-test-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/FrenchNotes-self-test-*/self-test-result.json
            ${{ runner.temp }}/FrenchNotes-installed-self-test-*/self-test-result.json

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v7
        with:
          name: FrenchNotes-Windows-${{ steps.version.outputs.version }}-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/FrenchNotes.exe
            dist/FrenchNotes-Setup-*.exe
            dist/FrenchNotes-*-Windows-x64.zip
            dist/SHA256SUMS.txt
            dist/README-windows.txt
            dist/FrenchNotes-self-test-result.json

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified Windows distribution
        uses: actions/download-artifact@v8
        with:
          name: FrenchNotes-Windows-${{ needs.build.outputs.version }}-x64
          path: release-files

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != "v$APP_VERSION" ]]; then
            echo "Release tag must match the packaged application version: v$APP_VERSION" >&2
            exit 1
          fi
          cd release-files
          sha256sum --check SHA256SUMS.txt
          assets=(
            "FrenchNotes.exe"
            "FrenchNotes-Setup-$APP_VERSION.exe"
            "FrenchNotes-$APP_VERSION-Windows-x64.zip"
            "SHA256SUMS.txt"
            "README-windows.txt"
          )
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Windows 10/11 x64 本地法语笔记软件，运行时无需安装 Python。

          - 安装版：下载 `FrenchNotes-Setup-*.exe`，安装后使用开始菜单或桌面快捷方式。
          - 免安装版：下载 `FrenchNotes-*-Windows-x64.zip`，解压后运行 `FrenchNotes.exe`。
          - 默认 CSV 数据存放在 `%LOCALAPPDATA%\FrenchNotes\notes.csv`，卸载时保留。
          - 每行录入一条，自动分类和去重；导出为本地 Word `.docx`。

          Windows 构建已通过单元测试、实际 EXE 自检以及安装/卸载验证。文件校验值见 `SHA256SUMS.txt`。本版本尚未数字签名。
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --verify-tag \
              --title "FrenchNotes $APP_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
